# Optional: Render > New > Blueprint (or create a Web Service manually).
# Aiven MySQL is EXTERNAL and must be created before deploying this blueprint.
services:
  - type: web
    name: jodok
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: JODOK_AUTO_SEED
        value: "true"
      - key: MYSQLDATABASE
        value: defaultdb
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
# Optional keys: GROQ_API_KEY, PAYOS_*, APP_PUBLIC_BASE_URL
