# One-command run for a computer or VPS with Docker Compose.
# Demo data resets only when 'docker compose down -v' is used.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jodok_demo_mysql_2026}
      MYSQL_DATABASE: fashionweb
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 4s
      retries: 30
    # no public MySQL port

  jodok:
    build: .
    restart: unless-stopped
    ports:
      - "${JODOK_HTTP_PORT:-8080}:10000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQLHOST: mysql
      MYSQLPORT: '3306'
      MYSQLDATABASE: fashionweb
      MYSQLUSER: root
      MYSQLPASSWORD: ${MYSQL_ROOT_PASSWORD:-jodok_demo_mysql_2026}
      JODOK_AUTO_SEED: 'true'
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
volumes:
  mysql_data:
