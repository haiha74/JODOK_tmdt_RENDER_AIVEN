# JODOK production profile for Render Free + Aiven MySQL.
server.port=${PORT:10000}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Aiven connection information: MySQL host/port/db/user/password from its Overview page.
# sslMode=REQUIRED encrypts network traffic. For certificate verification in a
# real production environment use Aiven's CA and sslMode=VERIFY_IDENTITY.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE:defaultdb}?sslMode=REQUIRED&serverTimezone=Asia/Ho_Chi_Minh&connectTimeout=15000&tcpKeepAlive=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven Free has limited connections; Render Free has only 512 MB RAM.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1200000

# Schema comes from seed/fashionweb.sql (17 tables).
# Avoid Hibernate schema changes on Aiven where primary keys are required by default.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configurable signing key, generated by Render Blueprint or added in Dashboard.
jwt.secret=${JWT_SECRET}
# Forwarded headers ensure correct HTTPS redirect handling.
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# Speed up JSON/HTML/CSS/JS over slow networks (Render <-> browser).
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=application/json,application/javascript,text/javascript,text/html,text/css,text/plain,image/svg+xml
# Static assets (not API responses) can be cached for 5 minutes.
spring.web.resources.cache.cachecontrol.max-age=300s
# Keep worker threads modest on 512 MB / 0.1 CPU Render Free.
server.tomcat.threads.max=20
# Hibernate collection/association batch size reduces MySQL N+1 round trips.
spring.jpa.properties.hibernate.default_batch_fetch_size=32
