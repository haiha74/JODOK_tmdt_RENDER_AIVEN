<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>JODOK Staff</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=5">
</head>

<body class="bg-[#f5f2ef]">

<!-- LOGIN -->
<section id="staffLogin" class="min-h-screen grid lg:grid-cols-2">

  <div class="flex items-center px-20">
    <div class="max-w-xl">
      <p class="uppercase tracking-[6px] text-red-800 font-bold mb-8">
        JODOK STAFF
      </p>

      <h1 class="serif text-7xl leading-tight mb-8">
        Đăng nhập nhân viên
      </h1>

      <p class="text-3xl text-neutral-700 leading-relaxed">
        Quản lý đơn hàng, quản lý tồn kho và hỗ trợ vận hành cửa hàng.
      </p>
    </div>
  </div>

  <div class="flex items-center justify-center p-10">
    <div class="bg-white rounded-[36px] shadow-sm border w-full max-w-md p-10">

      <h2 class="serif text-5xl text-center mb-10">
        Staff Login
      </h2>

      <input
        id="staffEmail"
        type="email"
        placeholder="Email nhân viên"
        class="w-full h-16 rounded-3xl border px-6 text-lg mb-5 outline-none"
      >

      <input
        id="staffPassword"
        type="password"
        placeholder="Mật khẩu"
        class="w-full h-16 rounded-3xl border px-6 text-lg mb-7 outline-none"
      >

      <button
        onclick="loginStaff()"
        class="w-full h-16 rounded-full bg-[#b31313] hover:bg-[#920f0f]
               text-white text-xl font-bold transition"
      >
        Đăng nhập
      </button>

      <p id="staffMsg"
         class="text-center text-red-700 font-semibold mt-5">
      </p>

      <div class="text-center mt-8">
        <a href="/"
           class="text-neutral-500 hover:text-black text-lg">
          ← Quay lại shop
        </a>
      </div>

    </div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="staffDashboard" class="hidden p-10">

  <div class="bg-white rounded-[36px] border p-10 mb-8 flex justify-between items-center">
    <div>
      <p class="uppercase tracking-[4px] text-red-800 font-bold mb-3">
        STAFF PANEL
      </p>

      <h1 class="serif text-6xl">
        Quản lý nhân viên
      </h1>

      <p class="text-neutral-600 mt-3 text-lg">
        Quản lý đơn hàng, theo dõi tồn kho và cập nhật số lượng sản phẩm.
      </p>
    </div>

    <button
      onclick="logoutStaff()"
      class="bg-black text-white rounded-full px-7 py-4 font-bold"
    >
      Đăng xuất
    </button>
  </div>

  <div id="staffContent"></div>

</section>

<!-- MODAL CHI TIẾT ĐƠN -->
<div id="orderModal"
     class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-5">

  <div class="bg-white rounded-[36px] w-full max-w-4xl p-8 max-h-[90vh] overflow-y-auto">

    <div class="flex justify-between items-center mb-8">
      <h2 class="serif text-5xl">Chi tiết đơn hàng</h2>

      <button
        onclick="closeOrderDetail()"
        class="text-4xl"
      >
        ×
      </button>
    </div>

    <div id="orderDetailContent"></div>

  </div>
</div>

<script src="/js/staff.js"></script>



</body>
</html>
